<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocky Dashboard</title>
<style>
/* ================================================================
   Reset & base
   ================================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg:          #0d1117;
    --bg-card:     #161b22;
    --bg-header:   #0d1117;
    --border:      #30363d;
    --text:        #e6edf3;
    --text-dim:    #8b949e;
    --green:       #3fb950;
    --green-dim:   #238636;
    --red:         #f85149;
    --red-dim:     #da3633;
    --yellow:      #d29922;
    --blue:        #58a6ff;
    --purple:      #bc8cff;
    --font-mono:   'Cascadia Mono', 'Consolas', 'SF Mono', 'Monaco', monospace;
    --font-sans:   -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
}

body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ================================================================
   Header
   ================================================================ */
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 16px;
}

.logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
}

.logo span { color: var(--green); }

.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.status-badge.active {
    background: rgba(63, 185, 80, 0.15);
    color: var(--green);
    border: 1px solid rgba(63, 185, 80, 0.3);
}

.status-badge.dormant {
    background: rgba(248, 81, 73, 0.15);
    color: var(--red);
    border: 1px solid rgba(248, 81, 73, 0.3);
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
}

.status-badge.active .status-dot {
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.header-right {
    display: flex;
    align-items: center;
    gap: 16px;
}

.header-meta {
    font-size: 12px;
    color: var(--text-dim);
    text-align: right;
    line-height: 1.4;
}

/* Kill switch button */
.btn-dormant {
    padding: 6px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
}

.btn-dormant:hover {
    border-color: var(--red);
    color: var(--red);
}

.btn-dormant.is-dormant {
    background: rgba(63, 185, 80, 0.1);
    border-color: var(--green-dim);
    color: var(--green);
}

.btn-dormant.is-dormant:hover {
    background: rgba(63, 185, 80, 0.2);
}

/* ================================================================
   Main layout
   ================================================================ */
main {
    display: flex;
    flex: 1;
    overflow: hidden;
}

/* ================================================================
   Log viewer (left panel)
   ================================================================ */
.log-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    min-width: 0;
}

.log-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-card);
    flex-shrink: 0;
}

.log-toolbar label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.filter-btn {
    padding: 3px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
}

.filter-btn:hover { border-color: var(--blue); color: var(--blue); }
.filter-btn.active { background: rgba(88, 166, 255, 0.15); color: var(--blue); border-color: var(--blue); }

.log-toolbar .spacer { flex: 1; }

.log-controls {
    display: flex;
    align-items: center;
    gap: 8px;
}

.btn-icon {
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
}
.btn-icon:hover { border-color: var(--text); color: var(--text); }

.log-search {
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    width: 180px;
    outline: none;
    font-family: var(--font-mono);
}
.log-search:focus { border-color: var(--blue); }
.log-search::placeholder { color: var(--text-dim); }

.log-viewer {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.65;
    background: var(--bg);
}

.log-line {
    padding: 0 16px;
    white-space: pre-wrap;
    word-break: break-all;
}

.log-line:hover {
    background: rgba(88, 166, 255, 0.04);
}

/* Level-based coloring */
.log-line.level-info    { color: var(--text); }
.log-line.level-warning { color: var(--yellow); }
.log-line.level-error   { color: var(--red); }
.log-line.level-debug   { color: var(--text-dim); }

.log-line .timestamp { color: var(--text-dim); }
.log-line .level-tag {
    font-weight: 700;
    display: inline-block;
    min-width: 65px;
}

/* Plain-English mode tags */
.plain-lead {
    font-weight: 700;
    margin-right: 4px;
}
.plain-lead.warn { color: var(--yellow); }
.plain-lead.err  { color: var(--red); }
.plain-proc {
    color: var(--purple);
    font-weight: 600;
    margin-right: 6px;
}

.log-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-card);
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
}

.connection-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 6px;
}
.connection-dot.connected { background: var(--green); }
.connection-dot.disconnected { background: var(--red); }

/* ================================================================
   Sidebar (right panel)
   ================================================================ */
.sidebar {
    width: 340px;
    flex-shrink: 0;
    overflow-y: auto;
    background: var(--bg);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
}

.card-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.card-body {
    padding: 12px 14px;
}

/* Running processes */
.process-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.process-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
}

.process-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
}

.process-dot.running {
    background: var(--green);
    box-shadow: 0 0 6px rgba(63, 185, 80, 0.5);
    animation: pulse 2s ease-in-out infinite;
}

.empty-state {
    font-size: 12px;
    color: var(--text-dim);
    font-style: italic;
    padding: 4px 0;
}

/* Task cards */
.task-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.task-item {
    padding: 10px 12px;
    background: var(--bg);
    border-radius: 6px;
    border: 1px solid var(--border);
}

.task-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
}

.task-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
}

/* Toggle switch */
.toggle {
    position: relative;
    width: 36px;
    height: 20px;
    flex-shrink: 0;
}

.toggle input {
    opacity: 0;
    width: 0;
    height: 0;
}

.toggle-slider {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: #484f58;
    cursor: pointer;
    transition: background 0.2s;
}

.toggle-slider::before {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    left: 3px;
    bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: transform 0.2s;
}

.toggle input:checked + .toggle-slider {
    background: var(--green-dim);
}

.toggle input:checked + .toggle-slider::before {
    transform: translateX(16px);
}

.task-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 11px;
    color: var(--text-dim);
}

.task-meta span {
    display: flex;
    align-items: center;
    gap: 4px;
}

.task-status-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
}
.task-status-badge.running { background: rgba(63, 185, 80, 0.15); color: var(--green); }
.task-status-badge.ready   { background: rgba(88, 166, 255, 0.1); color: var(--blue); }
.task-status-badge.disabled { background: rgba(139, 148, 158, 0.1); color: var(--text-dim); }

.tasks-loading {
    font-size: 12px;
    color: var(--text-dim);
    padding: 8px 0;
}

/* Dormant card */
.dormant-info {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
}

.dormant-info strong {
    color: var(--red);
}

/* ================================================================
   Run-command card
   ================================================================ */
.run-group-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-dim);
    margin: 10px 0 4px;
}
.run-group-label:first-child { margin-top: 0; }

.run-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
}

.run-item .run-info { flex: 1; min-width: 0; }

.run-item .run-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
}

.run-item .run-desc {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.run-item .run-when {
    font-size: 10.5px;
    color: var(--text-dim);
    opacity: 0.85;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.run-item .run-when b { color: var(--blue); font-weight: 600; }

.danger-tag {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(248, 81, 73, 0.15);
    color: var(--red);
}

.dry-check {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
}
.dry-check input { accent-color: var(--blue); }

.btn-run {
    padding: 4px 10px;
    border-radius: 5px;
    border: 1px solid var(--green-dim);
    background: rgba(63, 185, 80, 0.1);
    color: var(--green);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
}
.btn-run:hover { background: rgba(63, 185, 80, 0.22); }
.btn-run:disabled { opacity: 0.5; cursor: default; }
.btn-run.is-running {
    border-color: var(--yellow);
    background: rgba(210, 153, 34, 0.12);
    color: var(--yellow);
    cursor: default;
}

.btn-sched {
    padding: 4px 8px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
}
.btn-sched:hover { border-color: var(--blue); color: var(--blue); }

/* New-schedule form + task controls */
.btn-add {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid var(--green-dim);
    background: transparent;
    color: var(--green);
    cursor: pointer;
}
.btn-add:hover { background: rgba(63, 185, 80, 0.12); }

.sched-form {
    display: none;
    flex-direction: column;
    gap: 8px;
    padding: 10px 0 14px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
}
.sched-form.open { display: flex; }

.sched-form select,
.sched-form input[type="text"],
.sched-form input[type="time"] {
    padding: 5px 8px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    font-family: var(--font-sans);
    outline: none;
    width: 100%;
}
.sched-form select:focus,
.sched-form input:focus { border-color: var(--blue); }

.sched-form-row {
    display: flex;
    gap: 8px;
    align-items: center;
}
.sched-form-row > * { flex: 1; }

.sched-form-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
}

.btn-primary {
    padding: 5px 14px;
    border-radius: 5px;
    border: 1px solid var(--green-dim);
    background: var(--green-dim);
    color: white;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
}
.btn-primary:hover { filter: brightness(1.1); }

.btn-ghost {
    padding: 5px 14px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
}
.btn-ghost:hover { color: var(--text); border-color: var(--text); }

.task-actions {
    display: flex;
    align-items: center;
    gap: 6px;
}

.btn-task-icon {
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
}
.btn-task-icon:hover { color: var(--text); border-color: var(--text); }
.btn-task-icon.danger:hover { color: var(--red); border-color: var(--red); }

.task-edit-time {
    display: none;
    gap: 6px;
    align-items: center;
    margin-top: 8px;
}
.task-edit-time.open { display: flex; }
.task-edit-time input {
    padding: 3px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    outline: none;
}
.task-edit-time input:focus { border-color: var(--blue); }

.toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    max-width: 80vw;
}
.toast.show { opacity: 1; }
.toast.ok  { background: var(--green-dim); color: white; }
.toast.err { background: var(--red-dim); color: white; }

/* ================================================================
   Responsive — collapse sidebar below
   ================================================================ */
@media (max-width: 900px) {
    main { flex-direction: column; }
    .sidebar { width: 100%; max-height: 40vh; border-top: 1px solid var(--border); }
    .log-panel { border-right: none; }
}
</style>
</head>

<body>

<!-- ============================================================
     Header
     ============================================================ -->
<header>
    <div class="header-left">
        <div class="logo">🪨 <span>Rocky</span> Dashboard</div>
        <div id="status-badge" class="status-badge active">
            <div class="status-dot"></div>
            <span id="status-label">Active</span>
        </div>
    </div>
    <div class="header-right">
        <div class="header-meta">
            <div id="header-time"></div>
            <div id="header-log-info"></div>
        </div>
        <button id="btn-dormant" class="btn-dormant" onclick="toggleDormant()">
            ⏸ Pause Rocky
        </button>
    </div>
</header>

<!-- ============================================================
     Main content
     ============================================================ -->
<main>
    <!-- Log viewer -->
    <div class="log-panel">
        <div class="log-toolbar">
            <label>View:</label>
            <button class="filter-btn view-btn active" data-view="plain" onclick="setLogMode('plain')">Plain English</button>
            <button class="filter-btn view-btn" data-view="tech" onclick="setLogMode('tech')">Technical</button>
            <span style="width:1px; height:18px; background:var(--border); margin:0 4px;"></span>
            <label>Show:</label>
            <button class="filter-btn active" data-level="all" onclick="setFilter('all')">All</button>
            <button class="filter-btn" data-level="info" onclick="setFilter('info')">Info</button>
            <button class="filter-btn" data-level="warning" onclick="setFilter('warning')">Warn</button>
            <button class="filter-btn" data-level="error" onclick="setFilter('error')">Error</button>
            <div class="spacer"></div>
            <div class="log-controls">
                <input type="text" class="log-search" id="log-search" placeholder="Search logs…" oninput="applyFilters()">
                <button class="btn-icon" id="btn-autoscroll" onclick="toggleAutoscroll()" title="Auto-scroll">
                    ↓ Follow
                </button>
                <button class="btn-icon" onclick="clearLog()" title="Clear display">Clear</button>
            </div>
        </div>

        <div class="log-viewer" id="log-viewer"></div>

        <div class="log-footer">
            <div>
                <span class="connection-dot connected" id="connection-dot"></span>
                <span id="connection-status">Connected</span>
            </div>
            <div id="log-line-count">0 lines</div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">

        <!-- Running processes -->
        <div class="card">
            <div class="card-header">
                Running Now
                <span id="running-count" style="color: var(--green); font-size: 11px;"></span>
            </div>
            <div class="card-body">
                <ul class="process-list" id="process-list">
                    <li class="empty-state">No commands running</li>
                </ul>
            </div>
        </div>

        <!-- Dormant info (hidden when active) -->
        <div class="card" id="dormant-card" style="display: none;">
            <div class="card-header" style="color: var(--red);">
                ⚠ Rocky is Paused
            </div>
            <div class="card-body">
                <div class="dormant-info" id="dormant-info"></div>
            </div>
        </div>

        <!-- Run a command -->
        <div class="card">
            <div class="card-header">Run a Command</div>
            <div class="card-body">
                <div id="run-list">
                    <div class="tasks-loading">Loading commands…</div>
                </div>
            </div>
        </div>

        <!-- Scheduled tasks -->
        <div class="card">
            <div class="card-header">
                Scheduled Tasks
                <span style="display:flex; gap:6px;">
                    <button class="btn-add" onclick="setupRecommended()" title="Create the standard daily schedule in one click">⚡ Auto-setup</button>
                    <button class="btn-add" onclick="toggleSchedForm()" title="New scheduled task">+ New</button>
                    <button class="btn-icon" onclick="refreshStatus(true)" title="Refresh" style="font-size: 11px; padding: 2px 8px;">↻</button>
                </span>
            </div>
            <div class="card-body">
                <!-- New-schedule form -->
                <div class="sched-form" id="sched-form">
                    <select id="sched-flag"></select>
                    <input type="text" id="sched-name" placeholder="Task name (optional)">
                    <div class="sched-form-row">
                        <select id="sched-freq" onchange="onFreqChange()">
                            <option value="DAILY">Daily</option>
                            <option value="WEEKLY">Weekly</option>
                            <option value="HOURLY">Hourly</option>
                            <option value="MINUTE">Every N min</option>
                            <option value="ONCE">Once</option>
                        </select>
                        <input type="time" id="sched-time" value="16:00">
                        <input type="text" id="sched-interval" placeholder="N" style="display:none;">
                    </div>
                    <label class="dry-check" id="sched-dry-wrap" style="display:none;">
                        <input type="checkbox" id="sched-dry"> dry-run
                    </label>
                    <div class="sched-form-actions">
                        <button class="btn-ghost" onclick="toggleSchedForm(false)">Cancel</button>
                        <button class="btn-primary" onclick="createSchedule()">Create</button>
                    </div>
                </div>

                <div class="task-list" id="task-list">
                    <div class="tasks-loading">Loading tasks…</div>
                </div>
            </div>
        </div>

    </div>
</main>

<div class="toast" id="toast"></div>

<!-- ============================================================
     JavaScript
     ============================================================ -->
<script>
(function() {
    "use strict";

    // --- State ---
    let autoScroll = true;
    let currentFilter = "all";
    let searchText = "";
    let plainMode = true;      // Plain English view by default
    let logLines = [];         // log entries: { raw, level, _plain? }
    const MAX_LINES = 5000;
    let sseConnected = false;
    let statusInterval = null;
    let commands = [];          // Rocky command registry from /api/commands
    let runningSet = [];        // flags currently running (from /api/status)
    let runInfo = {};           // per-command last-ran / next-run (from /api/status)

    const viewer   = document.getElementById("log-viewer");
    const lineCount = document.getElementById("log-line-count");

    // --- Helpers ---

    function escapeHtml(str) {
        const d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
    }

    let toastTimer = null;
    function toast(msg, ok = true) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = "toast show " + (ok ? "ok" : "err");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.className = "toast"; }, 3500);
    }

    function parseLevel(line) {
        if (line.includes("[ERROR]"))   return "error";
        if (line.includes("[WARNING]")) return "warning";
        if (line.includes("[WARN]"))    return "warning";
        if (line.includes("[DEBUG]"))   return "debug";
        return "info";
    }

    // --- Technical (raw) formatting ---

    function techFormat(raw) {
        return escapeHtml(raw)
            .replace(
                /^(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}[,.\d]*)/,
                '<span class="timestamp">$1</span>'
            )
            .replace(
                /\[(INFO|WARNING|WARN|ERROR|DEBUG)\]/,
                '<span class="level-tag">[$1]</span>'
            );
    }

    // --- Plain-English humanizing ---
    //
    // The log is written for engineers. In Plain mode we translate the lines
    // most people care about into ordinary language, hide pure noise, shorten
    // file paths to just the filename, and show a friendly clock time. Lines
    // we don't have a rule for still display — just cleaned up — so nothing is
    // ever silently lost (and Technical mode always shows the raw line).

    // Subsystem tag -> friendly process name (looked up case-insensitively).
    const PROCESS_NAMES = {
        "maple-digest": "Maple — client update",
        "maple-pma":    "Maple — email collection",
        "maple":        "Maple — client update",    // legacy tag (retired internal digest)
        "maple-client": "Maple — client update",    // legacy tag (pre-rename)
        "pma":          "Maple — email collection", // legacy tag on old log lines
        "pma-activity": "Maple — email collection", // legacy tag on old log lines
        "ella":  "Ella's case digest",
        "steve": "Steve's to-do list",
        "remy":  "Remy notice requests",
        "llt":   "Landlord-tenant drafts",
        "email-brain": "Writing-style library",
    };

    // Lines that are pure noise in Plain mode.
    const PLAIN_HIDE = [
        /^=+$/,                                   // separator bars
        /HTTP Request:/i,                         // raw API calls
        /\bHTTP\/1\.1\b/i,
        /token|tokens used|usage:/i,
    ];

    // [pattern, replacement] applied to the message text. $1.. capture groups.
    // First match wins, so specific rules go above general ones.
    const PLAIN_RULES = [
        // --- Job banners ---
        [/^Rocky\s*[—–-]\s*(.+?)\s*(?:\(.*\))?$/i,     "▸ Starting: $1"],
        [/Rocky starting up\b.*$/i,                     "Rocky is starting up."],

        // --- Maple client update (drafting into James's Drafts) ---
        [/DRY RUN\s*[—–-]\s*would draft\s+\S+\s+to\s+\[(.*?)\].*?subject:\s*'(.*?)'.*$/i,
            "Test run — the email “$2” would go to $1. Nothing was actually created."],
        [/^No client digest for\s*(\S+).*$/i,           "Maple had no client updates for $1 — no email needed today."],
        [/Stale outbox file\(s\) never drafted:\s*\[(.*?)\]\..*$/i,
            "An older Maple update ($1) never went out — worth a look."],
        [/OUTBOX NOT FOUND:?\s*(\S+).*$/i,              "Couldn't find Maple's outgoing-mail folder — probably a OneDrive sync problem, not a quiet day."],
        [/Drafted\s+(\S+)\s+to\s+\[(.*?)\].*$/i,        "Put the client update in James's Drafts, addressed to $2 — ready to review and send."],
        [/^Draft in:\s*(\S+)\s*\|\s*To:\s*\[(.*?)\].*Dry run:\s*True.*$/i,
            "Would create a draft email for $2 in $1's Drafts (test run)."],
        [/^Draft in:\s*(\S+)\s*\|\s*To:\s*\[(.*?)\].*$/i,
            "Creating a draft email for $2 in $1's Drafts."],

        // --- "Not sent / not drafted" outcomes, by reason ---
        [/^.*not (?:sent|drafted)\.\s*Reason:\s*dry_run\b.*$/i,  "Nothing was actually sent or saved — this was just a test."],
        [/^.*not (?:sent|drafted)\.\s*Reason:\s*no_digest_today\b.*$/i, "Nothing to send — a quiet day."],
        [/^.*not (?:sent|drafted)\.\s*Reason:\s*outbox_missing\b.*$/i,  "Skipped — Maple's outgoing-mail folder couldn't be found."],
        [/^.*?(\w[\w ]*?) not (?:sent|drafted)\.\s*Reason:\s*(.+?)\.?$/i,  "The $1 didn't go out (why: $2)."],

        // --- Digest / email jobs ---
        [/Wrote digest archive:?\s*(.+)$/i,            "Saved a copy of the summary ($1)."],
        [/DRY RUN\s*[—–-]\s*not sending\.?\s*(.*?)\.?\s*(?:Preview:.*)?$/i, "Test run — nothing was sent. Today's tally: $1."],
        [/Recipients:\s*\[(.*?)\]\s*\|\s*Dry run:\s*True/i,  "Would email: $1 (test run — nothing actually sent)."],
        [/Recipients:\s*\[(.*?)\]\s*\|\s*Dry run:\s*False/i, "Will email: $1."],
        [/Date:\s*([\d-]+)\s*\|.*$/i,                  "Looking at activity from $1."],
        [/^(?:Updater logs|Activity logs|Abstracts|Outbox):.*$/i, ""],  // path-only detail lines

        // --- Problems, in plain terms ---
        [/'client_secret' not found.*$/i,              "Rocky's mailbox sign-in key is missing from its settings — it can't read email until that's fixed."],
        [/Claude summary failed.*authentication_error.*$/i, "Couldn't sign in to the AI service (bad or missing key) — used a simple summary instead."],
        [/Claude summary failed.*$/i,                  "The AI summary didn't work — used a simple summary instead."],
        [/LOGS FOLDER NOT FOUND:?\s*(.*?)\s*[—–-].*$/i, "Couldn't find the activity-logs folder ($1) — sent an alert instead."],
        [/Cannot read case index.*$/i,                 "Couldn't open the case list — the file may not be downloaded from OneDrive yet."],
        [/Invalid\s+--?\w+\s*'?(.*?)'?;?\s*expected.*$/i, "One of the settings wasn't valid ($1)."],

        // --- Runs starting / already running ---
        [/Another rocky (\S+) is already running.*$/i, "$1 is already running — didn't start a second copy."],
        [/Launched '(.*?)'.*$/i,                       "Started $1 from the dashboard."],

        // --- Counts and housekeeping ---
        [/(\d+)\s+contributor\(s\),\s*(\d+)\s+file\(s\),\s*(\d+)\s+command\(s\),\s*(\d+)\s+failure\(s\)/i,
            "$1 people, $2 files, $3 actions, $4 problems"],
        [/Knowledge synthesis complete:.*?'updated':\s*(\d+).*$/i, "Finished updating the background notes — $1 deal(s) refreshed."],
        [/Synthesized\s+\d+\s*[—–-]\s*(.+?)\s*[—–-]\s*PMA\s*\((\d+)\s*new event\(s\)\)\.?$/i, "Updated the notes for $1 ($2 new item(s))."],
        [/Updated general knowledge\s*\((\d+)\s*chars?\)\.?$/i, "Updated the general notes."],
        [/Converted image\s+\S+\s*[→>—–-]+\s*(\S+).*$/i, "Turned an image into a PDF ($1)."],
        [/^done:\s*\{[\s\S]*$/i,                        "Finished."],
        [/Exported\s+(\d+)\s+record\(s\).*$/i,          "Collected $1 email(s) for Maple."],

        // --- Startup chatter ---
        [/Polling every\s+(\d+)s\b.*$/i,               "Checking for new mail every $1 seconds."],
        [/Loaded\s+\d+\s+chars?\s+of\s+instructions.*$/i, "Read its instructions."],
        [/Classifications will be written to:.*$/i,     "Ready to record what it finds."],
        [/Mailboxes:\s*(.+)$/i,                         "Watching these mailboxes: $1"],
        [/(Program|Data) dir:.*$/i,                     ""],   // drop path-only setup lines
    ];

    function prettyTime(raw) {
        const m = raw.match(/^\d{4}-\d{2}-\d{2}\s+(\d{2}):(\d{2}):\d{2}/);
        if (!m) return "";
        let h = parseInt(m[1], 10);
        const ap = h >= 12 ? "PM" : "AM";
        h = h % 12 || 12;
        return `${h}:${m[2]} ${ap}`;
    }

    function shortenPaths(s) {
        return s.replace(/[A-Za-z]:\\[^\s'")\]]+/g, p => {
            const parts = p.split("\\");
            return parts[parts.length - 1] || p;
        });
    }

    // Returns { hide, html } for Plain mode.
    function humanize(raw) {
        const m = raw.match(/^(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}[,.\d]*)\s+\[(\w+)\]\s*(.*)$/);
        const level = parseLevel(raw);
        let msg = m ? m[3] : raw;

        // Pull off a subsystem tag like "[Maple]" for a friendly label.
        let proc = "";
        const pm = msg.match(/^\[([\w-]+)\]\s*(.*)$/);
        if (pm) { proc = PROCESS_NAMES[pm[1].toLowerCase()] || pm[1]; msg = pm[2]; }

        if (PLAIN_HIDE.some(re => re.test(msg)) || msg.trim() === "")
            return { hide: true, html: "" };

        for (const [re, repl] of PLAIN_RULES) {
            if (re.test(msg)) { msg = msg.replace(re, repl); break; }
        }
        msg = shortenPaths(msg)
            .replace(/'([\w.@\\/-]+)'/g, "$1")   // unquote emails/filenames from lists
            .replace(/\(s\)/g, "s")              // "update(s)" -> "updates"
            .trim();
        if (msg === "") return { hide: true, html: "" };

        const time = prettyTime(raw);
        const lead = level === "error"   ? '<span class="plain-lead err">✗ Problem</span> '
                   : level === "warning" ? '<span class="plain-lead warn">⚠ Heads-up</span> '
                   : "";
        const procTag = proc ? `<span class="plain-proc">${escapeHtml(proc)}</span> ` : "";
        const timeTag = time ? `<span class="timestamp">${time}</span>  ` : "";
        return { hide: false, html: `${timeTag}${lead}${procTag}${escapeHtml(msg)}` };
    }

    function entryHidden(entry) {
        if (plainMode) {
            if (entry._plain === undefined) entry._plain = humanize(entry.raw);
            return entry._plain.hide;
        }
        return false;
    }

    function shouldShow(entry) {
        if (entryHidden(entry)) return false;
        if (currentFilter !== "all" && entry.level !== currentFilter) return false;
        if (searchText && !entry.raw.toLowerCase().includes(searchText)) return false;
        return true;
    }

    // --- Rendering ---

    function renderLine(entry) {
        const div = document.createElement("div");
        div.className = `log-line level-${entry.level}`;
        if (plainMode) {
            if (entry._plain === undefined) entry._plain = humanize(entry.raw);
            div.innerHTML = entry._plain.html;
        } else {
            div.innerHTML = techFormat(entry.raw);
        }
        div.dataset.level = entry.level;
        div.dataset.raw = entry.raw;
        if (!shouldShow(entry)) div.style.display = "none";
        return div;
    }

    function appendLine(raw) {
        const entry = { raw, level: parseLevel(raw) };
        logLines.push(entry);

        // Cap memory.
        if (logLines.length > MAX_LINES) {
            logLines.shift();
            if (viewer.firstChild) viewer.removeChild(viewer.firstChild);
        }

        viewer.appendChild(renderLine(entry));
        updateLineCount();

        if (autoScroll) {
            viewer.scrollTop = viewer.scrollHeight;
        }
    }

    function rebuildView() {
        viewer.innerHTML = "";
        for (const entry of logLines) {
            viewer.appendChild(renderLine(entry));
        }
        updateLineCount();
        if (autoScroll) viewer.scrollTop = viewer.scrollHeight;
    }

    function updateLineCount() {
        const visible = viewer.querySelectorAll('.log-line:not([style*="display: none"])').length;
        const total = logLines.length;
        lineCount.textContent = visible === total
            ? `${total} lines`
            : `${visible} / ${total} lines`;
    }

    // --- View mode (Plain English / Technical) ---

    window.setLogMode = function(mode) {
        plainMode = (mode === "plain");
        document.querySelectorAll(".view-btn").forEach(btn => {
            btn.classList.toggle("active", btn.dataset.view === mode);
        });
        rebuildView();
    };

    // --- Filters ---

    window.setFilter = function(level) {
        currentFilter = level;
        document.querySelectorAll(".filter-btn[data-level]").forEach(btn => {
            btn.classList.toggle("active", btn.dataset.level === level);
        });
        applyFilters();
    };

    window.applyFilters = function() {
        searchText = document.getElementById("log-search").value.toLowerCase();
        // Toggle visibility per line (cheaper than a full rebuild).
        const els = viewer.querySelectorAll(".log-line");
        let i = 0;
        for (const entry of logLines) {
            const el = els[i++];
            if (el) el.style.display = shouldShow(entry) ? "" : "none";
        }
        updateLineCount();
    };

    // --- Auto-scroll ---

    window.toggleAutoscroll = function() {
        autoScroll = !autoScroll;
        const btn = document.getElementById("btn-autoscroll");
        btn.style.borderColor = autoScroll ? "var(--blue)" : "";
        btn.style.color = autoScroll ? "var(--blue)" : "";
        if (autoScroll) viewer.scrollTop = viewer.scrollHeight;
    };

    // Pause auto-scroll if user scrolls up.
    viewer.addEventListener("scroll", () => {
        if (!autoScroll) return;
        const atBottom = viewer.scrollHeight - viewer.scrollTop - viewer.clientHeight < 40;
        if (!atBottom) {
            autoScroll = false;
            const btn = document.getElementById("btn-autoscroll");
            btn.style.borderColor = "";
            btn.style.color = "";
        }
    });

    window.clearLog = function() {
        logLines = [];
        viewer.innerHTML = "";
        updateLineCount();
    };

    // --- SSE connection ---

    function connectSSE() {
        const es = new EventSource("/api/stream");

        es.onopen = () => {
            sseConnected = true;
            updateConnectionUI(true);
        };

        es.onmessage = (event) => {
            if (!event.data || event.data.trim() === "") return;
            try {
                const line = JSON.parse(event.data);
                if (typeof line === "string" && line.length > 0) {
                    appendLine(line);
                }
            } catch (e) {
                // Non-JSON data (shouldn't happen).
            }
        };

        es.onerror = () => {
            sseConnected = false;
            updateConnectionUI(false);
            es.close();
            // Reconnect after 3 seconds.
            setTimeout(connectSSE, 3000);
        };
    }

    function updateConnectionUI(connected) {
        const dot = document.getElementById("connection-dot");
        const label = document.getElementById("connection-status");
        dot.className = "connection-dot " + (connected ? "connected" : "disconnected");
        label.textContent = connected ? "Live" : "Reconnecting…";
    }

    // --- Load history ---

    async function loadHistory() {
        try {
            const res = await fetch("/api/log-history");
            const data = await res.json();
            for (const line of data.lines) {
                if (line) appendLine(line);
            }
        } catch (e) {
            console.warn("Failed to load log history:", e);
        }
    }

    // --- Status polling ---

    function formatBytes(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / 1048576).toFixed(1) + " MB";
    }

    function timeAgo(mtime) {
        if (!mtime) return "unknown";
        const seconds = Math.floor(Date.now() / 1000 - mtime);
        if (seconds < 5) return "just now";
        if (seconds < 60) return seconds + "s ago";
        if (seconds < 3600) return Math.floor(seconds / 60) + "m ago";
        if (seconds < 86400) return Math.floor(seconds / 3600) + "h ago";
        return Math.floor(seconds / 86400) + "d ago";
    }

    function cleanTaskName(fullName) {
        // Strip folder prefix like "\\Rocky\\" for display.
        return fullName.replace(/^\\+[^\\]+\\+/, "").replace(/^\\+/, "");
    }

    // Turn a Task Scheduler date string ("7/5/2026 4:00:00 PM") into
    // friendly wording ("today 4:00 PM", "tomorrow 7:30 AM", "Jul 9, 2:00 PM").
    // Unparseable strings pass through untouched.
    function friendlyWhen(s) {
        if (!s) return null;
        let d;
        if (s instanceof Date) {
            d = s;
        } else {
            s = String(s).trim();
            if (!s || /^(n\/a|never|disabled)$/i.test(s)) return null;
            d = new Date(s);
            if (isNaN(d)) return s;
        }
        if (d.getFullYear() < 2000) return null;  // schtasks "never ran" sentinel
        const t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        const now = new Date();
        const day = x => x.toDateString();
        const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
        const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
        if (day(d) === day(now)) return "today " + t;
        if (day(d) === day(tomorrow)) return "tomorrow " + t;
        if (day(d) === day(yesterday)) return "yesterday " + t;
        return d.toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + t;
    }

    // "Last ran ... · Next run ..." line under each command in Run a Command.
    function updateRunWhen() {
        document.querySelectorAll("[data-when]").forEach(el => {
            const ri = runInfo[el.dataset.when];
            if (!ri) { el.textContent = ""; return; }
            const last = ri.last_epoch
                ? `${timeAgo(ri.last_epoch)} (${friendlyWhen(new Date(ri.last_epoch * 1000))})`
                : "never";
            const next = ri.next_run ? friendlyWhen(ri.next_run) : null;
            el.innerHTML = `Last ran: <b>${escapeHtml(last)}</b> · Next run: <b>${escapeHtml(next || "not scheduled")}</b>`;
        });
    }

    window.refreshStatus = async function(fresh) {
        try {
            const res = await fetch("/api/status" + (fresh === true ? "?fresh=1" : ""));
            const data = await res.json();

            // --- Dormant status ---
            const badge = document.getElementById("status-badge");
            const label = document.getElementById("status-label");
            const btn = document.getElementById("btn-dormant");
            const dormantCard = document.getElementById("dormant-card");
            const dormantInfo = document.getElementById("dormant-info");

            if (data.dormant && data.dormant.dormant) {
                badge.className = "status-badge dormant";
                label.textContent = "Paused";
                btn.textContent = "▶ Resume Rocky";
                btn.classList.add("is-dormant");
                dormantCard.style.display = "";
                let info = "<strong>Rocky is paused.</strong> Scheduled tasks will skip their work.";
                if (data.dormant.reason) info += `<br>Reason: ${escapeHtml(data.dormant.reason)}`;
                if (data.dormant.timestamp) {
                    const d = new Date(data.dormant.timestamp);
                    info += `<br>Since: ${d.toLocaleString()}`;
                }
                dormantInfo.innerHTML = info;
            } else {
                badge.className = "status-badge active";
                label.textContent = "Active";
                btn.textContent = "⏸ Pause Rocky";
                btn.classList.remove("is-dormant");
                dormantCard.style.display = "none";
            }

            // --- Running processes ---
            runningSet = data.running || [];
            runInfo = data.run_info || {};
            updateRunButtons();
            updateRunWhen();
            const procList = document.getElementById("process-list");
            const runCount = document.getElementById("running-count");
            if (data.running && data.running.length > 0) {
                runCount.textContent = data.running.length + " active";
                procList.innerHTML = data.running.map(cmd =>
                    `<li class="process-item">
                        <span class="process-dot running"></span>
                        <span style="font-family: var(--font-mono); font-size: 12px;">${escapeHtml(cmd)}</span>
                    </li>`
                ).join("");
            } else {
                runCount.textContent = "";
                procList.innerHTML = '<li class="empty-state">No commands running</li>';
            }

            // --- Scheduled tasks (grouped like the run list, Maple together) ---
            const taskList = document.getElementById("task-list");
            if (data.tasks && data.tasks.length > 0) {
                // Sort: registry group order, then registry command order;
                // tasks we can't match to a command sort last.
                const groupOrder = [];
                for (const c of commands)
                    if (!groupOrder.includes(c.group)) groupOrder.push(c.group);
                const flagOrder = commands.map(c => c.flag);
                const sortKey = t => {
                    const gi = t.group ? groupOrder.indexOf(t.group) : -1;
                    const fi = t.flag ? flagOrder.indexOf(t.flag) : 999;
                    return (gi === -1 ? 900 : gi) * 1000 + (fi === -1 ? 999 : fi);
                };
                const sorted = data.tasks.slice().sort((a, b) => sortKey(a) - sortKey(b));

                let lastGroup = null;
                taskList.innerHTML = sorted.map(task => {
                    const displayName = cleanTaskName(task.name);
                    const isRunning = data.running && data.running.some(r =>
                        (task.flag && task.flag === r) ||
                        displayName.toLowerCase().replace(/[\s-]/g, "_").includes(r.toLowerCase()) ||
                        r.toLowerCase().includes(displayName.toLowerCase().replace(/[\s-]/g, "_"))
                    );
                    let statusClass = task.enabled ? "ready" : "disabled";
                    let statusText = task.enabled ? "On" : "Off";
                    if (isRunning) { statusClass = "running"; statusText = "Running now"; }

                    const group = task.group || "Other";
                    let header = "";
                    if (group !== lastGroup) {
                        header = `<div class="run-group-label">${escapeHtml(group)}</div>`;
                        lastGroup = group;
                    }

                    const next = friendlyWhen(task.next_run);
                    const last = friendlyWhen(task.last_run);
                    const nameJs = escapeHtml(task.name).replace(/'/g, "\\'");
                    const safe = btoa(task.name).replace(/=/g, "");
                    return `${header}<div class="task-item">
                        <div class="task-top">
                            <span class="task-name">${escapeHtml(displayName)}</span>
                            <div class="task-actions">
                                <button class="btn-task-icon" title="Edit start time"
                                        onclick="editTaskTime('${nameJs}')">🕑</button>
                                <button class="btn-task-icon danger" title="Delete task"
                                        onclick="deleteTaskSched('${nameJs}')">🗑</button>
                                <label class="toggle" title="${task.enabled ? 'Disable' : 'Enable'} this task">
                                    <input type="checkbox" ${task.enabled ? "checked" : ""}
                                           onchange="toggleTask('${nameJs}', this.checked)">
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                        </div>
                        <div class="task-meta">
                            <span><span class="task-status-badge ${statusClass}">${statusText}</span></span>
                            <span>Next run: ${escapeHtml(next || "not scheduled")}</span>
                            <span>Last ran: ${escapeHtml(last || "never")}</span>
                        </div>
                        <div class="task-edit-time" id="edit-${safe}">
                            <input type="time" value="16:00">
                            <button class="btn-primary" onclick="saveTaskTime('${nameJs}', '${safe}')">Save</button>
                        </div>
                    </div>`;
                }).join("");
            } else {
                taskList.innerHTML = '<div class="empty-state">No Rocky tasks found in Task Scheduler.<br><br><span style="font-size: 11px; color: var(--text-dim);">Tasks should be created in a <code style="background: var(--bg); padding: 2px 4px; border-radius: 3px;">\\Rocky\\</code> folder in Task Scheduler, or have "Rocky" in their name.</span></div>';
            }

            // --- Header meta ---
            document.getElementById("header-time").textContent = new Date().toLocaleTimeString();
            if (data.log_size !== undefined) {
                document.getElementById("header-log-info").textContent =
                    `rocky.log · ${formatBytes(data.log_size)} · ${timeAgo(data.log_modified)}`;
            }

        } catch (e) {
            console.warn("Status fetch failed:", e);
        }
    };

    // --- Dormant toggle ---

    window.toggleDormant = async function() {
        try {
            await fetch("/api/dormant", { method: "POST" });
            await refreshStatus();
        } catch (e) {
            console.warn("Dormant toggle failed:", e);
        }
    };

    // --- Task toggle ---

    window.toggleTask = async function(taskName, enable) {
        try {
            const res = await fetch("/api/tasks/toggle", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: taskName, enable }),
            });
            const data = await res.json();
            if (!data.success) {
                alert("Failed to toggle task. You may need to run the dashboard as administrator.");
            }
            // Refresh after a moment (Task Scheduler needs a beat).
            setTimeout(refreshStatus, 1000);
        } catch (e) {
            console.warn("Task toggle failed:", e);
        }
    };

    // --- Run a command ---

    async function loadCommands() {
        try {
            const res = await fetch("/api/commands");
            const data = await res.json();
            commands = data.commands || [];
            runningSet = data.running || [];
            renderRunList();
            populateSchedFlags();
        } catch (e) {
            console.warn("Failed to load commands:", e);
        }
    }

    function renderRunList() {
        const host = document.getElementById("run-list");
        if (!commands.length) {
            host.innerHTML = '<div class="empty-state">No commands available.</div>';
            return;
        }
        const groups = {};
        for (const c of commands) (groups[c.group] = groups[c.group] || []).push(c);

        let html = "";
        for (const group of Object.keys(groups)) {
            html += `<div class="run-group-label">${escapeHtml(group)}</div>`;
            for (const c of groups[group]) {
                const isRunning = runningSet.includes(c.flag);
                const dry = c.dry_run
                    ? `<label class="dry-check" title="Run without making changes">
                           <input type="checkbox" data-dry="${c.flag}"> dry</label>`
                    : "";
                const danger = c.danger ? '<span class="danger-tag">writes</span>' : "";
                const sched = c.sched_time
                    ? `<button class="btn-sched" data-sched="${c.flag}"
                               title="Schedule this to run automatically"
                               onclick="quickSchedule('${c.flag}')">📅</button>`
                    : "";
                html += `<div class="run-item">
                    <div class="run-info">
                        <div class="run-name">${escapeHtml(c.label)} ${danger}</div>
                        <div class="run-desc" title="${escapeHtml(c.desc)}">${escapeHtml(c.desc)}</div>
                        <div class="run-when" data-when="${c.flag}"></div>
                    </div>
                    ${dry}
                    ${sched}
                    <button class="btn-run ${isRunning ? "is-running" : ""}"
                            data-run="${c.flag}"
                            ${isRunning ? "disabled" : ""}
                            onclick="runCommand('${c.flag}', this)">
                        ${isRunning ? "running…" : "▶ Run"}
                    </button>
                </div>`;
            }
        }
        host.innerHTML = html;
    }

    // Reflect the running set onto the run buttons (called from refreshStatus).
    function updateRunButtons() {
        document.querySelectorAll("[data-run]").forEach(btn => {
            const flag = btn.dataset.run;
            const running = runningSet.includes(flag);
            btn.classList.toggle("is-running", running);
            btn.disabled = running;
            btn.textContent = running ? "running…" : "▶ Run";
        });
    }

    window.runCommand = async function(flag, btn) {
        const cmd = commands.find(c => c.flag === flag);
        if (cmd && cmd.danger &&
            !confirm(`Run "${cmd.label}"? ${cmd.desc}.`)) return;

        const dryEl = document.querySelector(`[data-dry="${flag}"]`);
        const dryRun = dryEl ? dryEl.checked : false;

        btn.disabled = true;
        btn.textContent = "starting…";
        try {
            const res = await fetch("/api/run", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ flag, dry_run: dryRun }),
            });
            const data = await res.json();
            if (data.success) {
                toast(`Started ${flag}${dryRun ? " (dry-run)" : ""}`, true);
                runningSet.push(flag);
                updateRunButtons();
                setTimeout(refreshStatus, 1500);
            } else {
                toast(data.error || "Failed to start", false);
                btn.disabled = false;
                btn.textContent = "▶ Run";
            }
        } catch (e) {
            toast("Request failed", false);
            btn.disabled = false;
            btn.textContent = "▶ Run";
        }
    };

    // --- Schedule create / edit / delete ---

    function populateSchedFlags() {
        const sel = document.getElementById("sched-flag");
        sel.innerHTML = commands.map(c =>
            `<option value="${c.flag}">${escapeHtml(c.label)}</option>`
        ).join("");
        onFlagOrFreqChange();
        sel.onchange = onFlagOrFreqChange;
    }

    function onFlagOrFreqChange() {
        const flag = document.getElementById("sched-flag").value;
        const cmd = commands.find(c => c.flag === flag);
        const wrap = document.getElementById("sched-dry-wrap");
        wrap.style.display = (cmd && cmd.dry_run) ? "" : "none";
        if (!cmd || !cmd.dry_run) document.getElementById("sched-dry").checked = false;
    }

    window.onFreqChange = function() {
        const freq = document.getElementById("sched-freq").value;
        const timeEl = document.getElementById("sched-time");
        const intEl = document.getElementById("sched-interval");
        const needsTime = ["DAILY", "WEEKLY", "ONCE"].includes(freq);
        timeEl.style.display = needsTime ? "" : "none";
        intEl.style.display = (freq === "HOURLY" || freq === "MINUTE") ? "" : "none";
    };

    window.toggleSchedForm = function(open) {
        const form = document.getElementById("sched-form");
        const show = (open === undefined) ? !form.classList.contains("open") : open;
        form.classList.toggle("open", show);
    };

    // Open the new-schedule form pre-filled with a command's recommended slot.
    window.quickSchedule = function(flag) {
        const cmd = commands.find(c => c.flag === flag);
        if (!cmd) return;
        document.getElementById("sched-flag").value = flag;
        document.getElementById("sched-name").value = "";
        const freq = cmd.sched_freq || "DAILY";
        document.getElementById("sched-freq").value = freq;
        if (cmd.sched_time) document.getElementById("sched-time").value = cmd.sched_time;
        if (cmd.sched_interval)
            document.getElementById("sched-interval").value = cmd.sched_interval;
        onFreqChange();
        onFlagOrFreqChange();
        toggleSchedForm(true);
        document.getElementById("sched-form").scrollIntoView({ behavior: "smooth", block: "center" });
    };

    // One-click install of the standard daily schedule.
    window.setupRecommended = async function() {
        const recs = commands.filter(c => c.recommended);
        const lines = recs.map(c => {
            const when = c.sched_freq === "MINUTE"
                ? `every ${c.sched_interval} min`
                : `daily ${c.sched_time}`;
            return `  • ${c.label} — ${when}`;
        }).join("\n");
        if (!confirm(`Create the recommended schedule?\n\n${lines}\n\nExisting tasks are left untouched.`))
            return;
        try {
            const res = await fetch("/api/schedule/setup-recommended", { method: "POST" });
            const d = await res.json();
            const parts = [];
            if (d.created.length) parts.push(`${d.created.length} created`);
            if (d.skipped.length) parts.push(`${d.skipped.length} already existed`);
            if (d.failed.length)  parts.push(`${d.failed.length} failed`);
            toast(parts.join(" · ") || "Nothing to do", !d.failed.length);
            setTimeout(refreshStatus, 800);
        } catch (e) {
            toast("Request failed", false);
        }
    };

    window.createSchedule = async function() {
        const flag = document.getElementById("sched-flag").value;
        const name = document.getElementById("sched-name").value.trim();
        const freq = document.getElementById("sched-freq").value;
        const time = document.getElementById("sched-time").value;
        const interval = document.getElementById("sched-interval").value;
        const dryEl = document.getElementById("sched-dry");
        const dry_run = dryEl && dryEl.offsetParent !== null ? dryEl.checked : false;

        try {
            const res = await fetch("/api/schedule/create", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    flag, name: name || undefined, frequency: freq,
                    time, interval: interval ? Number(interval) : undefined, dry_run,
                }),
            });
            const data = await res.json();
            if (data.success) {
                toast("Scheduled task created", true);
                document.getElementById("sched-name").value = "";
                toggleSchedForm(false);
                setTimeout(refreshStatus, 800);
            } else {
                toast(data.message || data.error || "Create failed", false);
            }
        } catch (e) {
            toast("Request failed", false);
        }
    };

    window.editTaskTime = function(name) {
        const safe = btoa(name).replace(/=/g, "");
        const row = document.getElementById("edit-" + safe);
        if (row) row.classList.toggle("open");
    };

    window.saveTaskTime = async function(name, safe) {
        const input = document.querySelector(`#edit-${safe} input`);
        const time = input ? input.value : "";
        try {
            const res = await fetch("/api/schedule/update-time", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, time }),
            });
            const data = await res.json();
            if (data.success) { toast("Start time updated", true); setTimeout(refreshStatus, 800); }
            else toast(data.message || data.error || "Update failed", false);
        } catch (e) { toast("Request failed", false); }
    };

    window.deleteTaskSched = async function(name) {
        if (!confirm(`Delete scheduled task?\n${name}`)) return;
        try {
            const res = await fetch("/api/schedule/delete", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name }),
            });
            const data = await res.json();
            if (data.success) { toast("Task deleted", true); setTimeout(refreshStatus, 800); }
            else toast(data.message || data.error || "Delete failed", false);
        } catch (e) { toast("Request failed", false); }
    };

    // --- Boot ---

    async function init() {
        // Mark auto-scroll button as active.
        const btn = document.getElementById("btn-autoscroll");
        btn.style.borderColor = "var(--blue)";
        btn.style.color = "var(--blue)";

        // Load recent log history, then start SSE for new lines.
        await loadHistory();
        connectSSE();

        // Load the runnable/schedulable command registry.
        await loadCommands();

        // Poll status every 10 seconds.
        await refreshStatus();
        statusInterval = setInterval(refreshStatus, 10000);
    }

    init();
})();
</script>
</body>
</html>
