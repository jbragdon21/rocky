<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocky Dashboard</title>
<style>
/* ================================================================
   Reset & base
   ================================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg:          #0d1117;
    --bg-card:     #161b22;
    --bg-header:   #0d1117;
    --border:      #30363d;
    --text:        #e6edf3;
    --text-dim:    #8b949e;
    --green:       #3fb950;
    --green-dim:   #238636;
    --red:         #f85149;
    --red-dim:     #da3633;
    --yellow:      #d29922;
    --blue:        #58a6ff;
    --purple:      #bc8cff;
    --font-mono:   'Cascadia Mono', 'Consolas', 'SF Mono', 'Monaco', monospace;
    --font-sans:   -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
}

body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ================================================================
   Header
   ================================================================ */
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 16px;
}

.logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
}

.logo span { color: var(--green); }

.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.status-badge.active {
    background: rgba(63, 185, 80, 0.15);
    color: var(--green);
    border: 1px solid rgba(63, 185, 80, 0.3);
}

.status-badge.dormant {
    background: rgba(248, 81, 73, 0.15);
    color: var(--red);
    border: 1px solid rgba(248, 81, 73, 0.3);
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
}

.status-badge.active .status-dot {
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.header-right {
    display: flex;
    align-items: center;
    gap: 16px;
}

.header-meta {
    font-size: 12px;
    color: var(--text-dim);
    text-align: right;
    line-height: 1.4;
}

/* Kill switch button */
.btn-dormant {
    padding: 6px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
}

.btn-dormant:hover {
    border-color: var(--red);
    color: var(--red);
}

.btn-dormant.is-dormant {
    background: rgba(63, 185, 80, 0.1);
    border-color: var(--green-dim);
    color: var(--green);
}

.btn-dormant.is-dormant:hover {
    background: rgba(63, 185, 80, 0.2);
}

/* ================================================================
   Main layout
   ================================================================ */
main {
    display: flex;
    flex: 1;
    overflow: hidden;
}

/* ================================================================
   Log viewer (left panel)
   ================================================================ */
.log-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    min-width: 0;
}

.log-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-card);
    flex-shrink: 0;
}

.log-toolbar label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.filter-btn {
    padding: 3px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
}

.filter-btn:hover { border-color: var(--blue); color: var(--blue); }
.filter-btn.active { background: rgba(88, 166, 255, 0.15); color: var(--blue); border-color: var(--blue); }

.log-toolbar .spacer { flex: 1; }

.log-controls {
    display: flex;
    align-items: center;
    gap: 8px;
}

.btn-icon {
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
}
.btn-icon:hover { border-color: var(--text); color: var(--text); }

.log-search {
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    width: 180px;
    outline: none;
    font-family: var(--font-mono);
}
.log-search:focus { border-color: var(--blue); }
.log-search::placeholder { color: var(--text-dim); }

.log-viewer {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.65;
    background: var(--bg);
}

.log-line {
    padding: 0 16px;
    white-space: pre-wrap;
    word-break: break-all;
}

.log-line:hover {
    background: rgba(88, 166, 255, 0.04);
}

/* Level-based coloring */
.log-line.level-info    { color: var(--text); }
.log-line.level-warning { color: var(--yellow); }
.log-line.level-error   { color: var(--red); }
.log-line.level-debug   { color: var(--text-dim); }

.log-line .timestamp { color: var(--text-dim); }
.log-line .level-tag {
    font-weight: 700;
    display: inline-block;
    min-width: 65px;
}

.log-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-card);
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
}

.connection-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 6px;
}
.connection-dot.connected { background: var(--green); }
.connection-dot.disconnected { background: var(--red); }

/* ================================================================
   Sidebar (right panel)
   ================================================================ */
.sidebar {
    width: 340px;
    flex-shrink: 0;
    overflow-y: auto;
    background: var(--bg);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
}

.card-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.card-body {
    padding: 12px 14px;
}

/* Running processes */
.process-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.process-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
}

.process-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
}

.process-dot.running {
    background: var(--green);
    box-shadow: 0 0 6px rgba(63, 185, 80, 0.5);
    animation: pulse 2s ease-in-out infinite;
}

.empty-state {
    font-size: 12px;
    color: var(--text-dim);
    font-style: italic;
    padding: 4px 0;
}

/* Task cards */
.task-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.task-item {
    padding: 10px 12px;
    background: var(--bg);
    border-radius: 6px;
    border: 1px solid var(--border);
}

.task-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
}

.task-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
}

/* Toggle switch */
.toggle {
    position: relative;
    width: 36px;
    height: 20px;
    flex-shrink: 0;
}

.toggle input {
    opacity: 0;
    width: 0;
    height: 0;
}

.toggle-slider {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: #484f58;
    cursor: pointer;
    transition: background 0.2s;
}

.toggle-slider::before {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    left: 3px;
    bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: transform 0.2s;
}

.toggle input:checked + .toggle-slider {
    background: var(--green-dim);
}

.toggle input:checked + .toggle-slider::before {
    transform: translateX(16px);
}

.task-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 11px;
    color: var(--text-dim);
}

.task-meta span {
    display: flex;
    align-items: center;
    gap: 4px;
}

.task-status-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
}
.task-status-badge.running { background: rgba(63, 185, 80, 0.15); color: var(--green); }
.task-status-badge.ready   { background: rgba(88, 166, 255, 0.1); color: var(--blue); }
.task-status-badge.disabled { background: rgba(139, 148, 158, 0.1); color: var(--text-dim); }

.tasks-loading {
    font-size: 12px;
    color: var(--text-dim);
    padding: 8px 0;
}

/* Dormant card */
.dormant-info {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
}

.dormant-info strong {
    color: var(--red);
}

/* ================================================================
   Responsive — collapse sidebar below
   ================================================================ */
@media (max-width: 900px) {
    main { flex-direction: column; }
    .sidebar { width: 100%; max-height: 40vh; border-top: 1px solid var(--border); }
    .log-panel { border-right: none; }
}
</style>
</head>

<body>

<!-- ============================================================
     Header
     ============================================================ -->
<header>
    <div class="header-left">
        <div class="logo">🪨 <span>Rocky</span> Dashboard</div>
        <div id="status-badge" class="status-badge active">
            <div class="status-dot"></div>
            <span id="status-label">Active</span>
        </div>
    </div>
    <div class="header-right">
        <div class="header-meta">
            <div id="header-time"></div>
            <div id="header-log-info"></div>
        </div>
        <button id="btn-dormant" class="btn-dormant" onclick="toggleDormant()">
            ⏸ Pause Rocky
        </button>
    </div>
</header>

<!-- ============================================================
     Main content
     ============================================================ -->
<main>
    <!-- Log viewer -->
    <div class="log-panel">
        <div class="log-toolbar">
            <label>Filter:</label>
            <button class="filter-btn active" data-level="all" onclick="setFilter('all')">All</button>
            <button class="filter-btn" data-level="info" onclick="setFilter('info')">Info</button>
            <button class="filter-btn" data-level="warning" onclick="setFilter('warning')">Warn</button>
            <button class="filter-btn" data-level="error" onclick="setFilter('error')">Error</button>
            <div class="spacer"></div>
            <div class="log-controls">
                <input type="text" class="log-search" id="log-search" placeholder="Search logs…" oninput="applyFilters()">
                <button class="btn-icon" id="btn-autoscroll" onclick="toggleAutoscroll()" title="Auto-scroll">
                    ↓ Follow
                </button>
                <button class="btn-icon" onclick="clearLog()" title="Clear display">Clear</button>
            </div>
        </div>

        <div class="log-viewer" id="log-viewer"></div>

        <div class="log-footer">
            <div>
                <span class="connection-dot connected" id="connection-dot"></span>
                <span id="connection-status">Connected</span>
            </div>
            <div id="log-line-count">0 lines</div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">

        <!-- Running processes -->
        <div class="card">
            <div class="card-header">
                Running Now
                <span id="running-count" style="color: var(--green); font-size: 11px;"></span>
            </div>
            <div class="card-body">
                <ul class="process-list" id="process-list">
                    <li class="empty-state">No commands running</li>
                </ul>
            </div>
        </div>

        <!-- Dormant info (hidden when active) -->
        <div class="card" id="dormant-card" style="display: none;">
            <div class="card-header" style="color: var(--red);">
                ⚠ Rocky is Paused
            </div>
            <div class="card-body">
                <div class="dormant-info" id="dormant-info"></div>
            </div>
        </div>

        <!-- Scheduled tasks -->
        <div class="card">
            <div class="card-header">
                Scheduled Tasks
                <button class="btn-icon" onclick="refreshStatus()" title="Refresh" style="font-size: 11px; padding: 2px 8px;">↻</button>
            </div>
            <div class="card-body">
                <div class="task-list" id="task-list">
                    <div class="tasks-loading">Loading tasks…</div>
                </div>
            </div>
        </div>

    </div>
</main>

<!-- ============================================================
     JavaScript
     ============================================================ -->
<script>
(function() {
    "use strict";

    // --- State ---
    let autoScroll = true;
    let currentFilter = "all";
    let searchText = "";
    let logLines = [];         // all raw lines (strings)
    const MAX_LINES = 5000;
    let sseConnected = false;
    let statusInterval = null;

    const viewer   = document.getElementById("log-viewer");
    const lineCount = document.getElementById("log-line-count");

    // --- Helpers ---

    function escapeHtml(str) {
        const d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
    }

    function parseLevel(line) {
        if (line.includes("[ERROR]"))   return "error";
        if (line.includes("[WARNING]")) return "warning";
        if (line.includes("[WARN]"))    return "warning";
        if (line.includes("[DEBUG]"))   return "debug";
        return "info";
    }

    function formatLogLine(raw) {
        const level = parseLevel(raw);
        const escaped = escapeHtml(raw);

        // Highlight timestamp and level tag
        const formatted = escaped
            .replace(
                /^(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}[,.\d]*)/,
                '<span class="timestamp">$1</span>'
            )
            .replace(
                /\[(INFO|WARNING|WARN|ERROR|DEBUG)\]/,
                '<span class="level-tag">[$1]</span>'
            );

        return { level, html: formatted, raw };
    }

    function shouldShow(entry) {
        if (currentFilter !== "all" && entry.level !== currentFilter) return false;
        if (searchText && !entry.raw.toLowerCase().includes(searchText)) return false;
        return true;
    }

    // --- Rendering ---

    function renderLine(entry) {
        const div = document.createElement("div");
        div.className = `log-line level-${entry.level}`;
        div.innerHTML = entry.html;
        div.dataset.level = entry.level;
        div.dataset.raw = entry.raw;
        if (!shouldShow(entry)) div.style.display = "none";
        return div;
    }

    function appendLine(raw) {
        const entry = formatLogLine(raw);
        logLines.push(entry);

        // Cap memory.
        if (logLines.length > MAX_LINES) {
            logLines.shift();
            if (viewer.firstChild) viewer.removeChild(viewer.firstChild);
        }

        viewer.appendChild(renderLine(entry));
        updateLineCount();

        if (autoScroll) {
            viewer.scrollTop = viewer.scrollHeight;
        }
    }

    function rebuildView() {
        viewer.innerHTML = "";
        for (const entry of logLines) {
            viewer.appendChild(renderLine(entry));
        }
        updateLineCount();
        if (autoScroll) viewer.scrollTop = viewer.scrollHeight;
    }

    function updateLineCount() {
        const visible = viewer.querySelectorAll('.log-line:not([style*="display: none"])').length;
        const total = logLines.length;
        lineCount.textContent = visible === total
            ? `${total} lines`
            : `${visible} / ${total} lines`;
    }

    // --- Filters ---

    window.setFilter = function(level) {
        currentFilter = level;
        document.querySelectorAll(".filter-btn").forEach(btn => {
            btn.classList.toggle("active", btn.dataset.level === level);
        });
        applyFilters();
    };

    window.applyFilters = function() {
        searchText = document.getElementById("log-search").value.toLowerCase();
        // Instead of rebuilding, toggle visibility.
        const lines = viewer.querySelectorAll(".log-line");
        lines.forEach(el => {
            const level = el.dataset.level;
            const raw = el.dataset.raw;
            let show = true;
            if (currentFilter !== "all" && level !== currentFilter) show = false;
            if (searchText && !raw.toLowerCase().includes(searchText)) show = false;
            el.style.display = show ? "" : "none";
        });
        updateLineCount();
    };

    // --- Auto-scroll ---

    window.toggleAutoscroll = function() {
        autoScroll = !autoScroll;
        const btn = document.getElementById("btn-autoscroll");
        btn.style.borderColor = autoScroll ? "var(--blue)" : "";
        btn.style.color = autoScroll ? "var(--blue)" : "";
        if (autoScroll) viewer.scrollTop = viewer.scrollHeight;
    };

    // Pause auto-scroll if user scrolls up.
    viewer.addEventListener("scroll", () => {
        if (!autoScroll) return;
        const atBottom = viewer.scrollHeight - viewer.scrollTop - viewer.clientHeight < 40;
        if (!atBottom) {
            autoScroll = false;
            const btn = document.getElementById("btn-autoscroll");
            btn.style.borderColor = "";
            btn.style.color = "";
        }
    });

    window.clearLog = function() {
        logLines = [];
        viewer.innerHTML = "";
        updateLineCount();
    };

    // --- SSE connection ---

    function connectSSE() {
        const es = new EventSource("/api/stream");

        es.onopen = () => {
            sseConnected = true;
            updateConnectionUI(true);
        };

        es.onmessage = (event) => {
            if (!event.data || event.data.trim() === "") return;
            try {
                const line = JSON.parse(event.data);
                if (typeof line === "string" && line.length > 0) {
                    appendLine(line);
                }
            } catch (e) {
                // Non-JSON data (shouldn't happen).
            }
        };

        es.onerror = () => {
            sseConnected = false;
            updateConnectionUI(false);
            es.close();
            // Reconnect after 3 seconds.
            setTimeout(connectSSE, 3000);
        };
    }

    function updateConnectionUI(connected) {
        const dot = document.getElementById("connection-dot");
        const label = document.getElementById("connection-status");
        dot.className = "connection-dot " + (connected ? "connected" : "disconnected");
        label.textContent = connected ? "Live" : "Reconnecting…";
    }

    // --- Load history ---

    async function loadHistory() {
        try {
            const res = await fetch("/api/log-history");
            const data = await res.json();
            for (const line of data.lines) {
                if (line) appendLine(line);
            }
        } catch (e) {
            console.warn("Failed to load log history:", e);
        }
    }

    // --- Status polling ---

    function formatBytes(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / 1048576).toFixed(1) + " MB";
    }

    function timeAgo(mtime) {
        if (!mtime) return "unknown";
        const seconds = Math.floor(Date.now() / 1000 - mtime);
        if (seconds < 5) return "just now";
        if (seconds < 60) return seconds + "s ago";
        if (seconds < 3600) return Math.floor(seconds / 60) + "m ago";
        if (seconds < 86400) return Math.floor(seconds / 3600) + "h ago";
        return Math.floor(seconds / 86400) + "d ago";
    }

    function cleanTaskName(fullName) {
        // Strip folder prefix like "\\Rocky\\" for display.
        return fullName.replace(/^\\+[^\\]+\\+/, "").replace(/^\\+/, "");
    }

    window.refreshStatus = async function() {
        try {
            const res = await fetch("/api/status");
            const data = await res.json();

            // --- Dormant status ---
            const badge = document.getElementById("status-badge");
            const label = document.getElementById("status-label");
            const btn = document.getElementById("btn-dormant");
            const dormantCard = document.getElementById("dormant-card");
            const dormantInfo = document.getElementById("dormant-info");

            if (data.dormant && data.dormant.dormant) {
                badge.className = "status-badge dormant";
                label.textContent = "Paused";
                btn.textContent = "▶ Resume Rocky";
                btn.classList.add("is-dormant");
                dormantCard.style.display = "";
                let info = "<strong>Rocky is paused.</strong> Scheduled tasks will skip their work.";
                if (data.dormant.reason) info += `<br>Reason: ${escapeHtml(data.dormant.reason)}`;
                if (data.dormant.timestamp) {
                    const d = new Date(data.dormant.timestamp);
                    info += `<br>Since: ${d.toLocaleString()}`;
                }
                dormantInfo.innerHTML = info;
            } else {
                badge.className = "status-badge active";
                label.textContent = "Active";
                btn.textContent = "⏸ Pause Rocky";
                btn.classList.remove("is-dormant");
                dormantCard.style.display = "none";
            }

            // --- Running processes ---
            const procList = document.getElementById("process-list");
            const runCount = document.getElementById("running-count");
            if (data.running && data.running.length > 0) {
                runCount.textContent = data.running.length + " active";
                procList.innerHTML = data.running.map(cmd =>
                    `<li class="process-item">
                        <span class="process-dot running"></span>
                        <span style="font-family: var(--font-mono); font-size: 12px;">${escapeHtml(cmd)}</span>
                    </li>`
                ).join("");
            } else {
                runCount.textContent = "";
                procList.innerHTML = '<li class="empty-state">No commands running</li>';
            }

            // --- Scheduled tasks ---
            const taskList = document.getElementById("task-list");
            if (data.tasks && data.tasks.length > 0) {
                taskList.innerHTML = data.tasks.map(task => {
                    const displayName = cleanTaskName(task.name);
                    const isRunning = data.running && data.running.some(r =>
                        displayName.toLowerCase().replace(/[\s-]/g, "_").includes(r.toLowerCase()) ||
                        r.toLowerCase().includes(displayName.toLowerCase().replace(/[\s-]/g, "_"))
                    );
                    let statusClass = task.enabled ? "ready" : "disabled";
                    let statusText = task.enabled ? "Enabled" : "Disabled";
                    if (isRunning) { statusClass = "running"; statusText = "Running"; }

                    return `<div class="task-item">
                        <div class="task-top">
                            <span class="task-name">${escapeHtml(displayName)}</span>
                            <label class="toggle" title="${task.enabled ? 'Disable' : 'Enable'} this task">
                                <input type="checkbox" ${task.enabled ? "checked" : ""}
                                       onchange="toggleTask('${escapeHtml(task.name).replace(/'/g, "\\'")}', this.checked)">
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                        <div class="task-meta">
                            <span><span class="task-status-badge ${statusClass}">${statusText}</span></span>
                            <span>Next: ${escapeHtml(task.next_run || "N/A")}</span>
                            <span>Last: ${escapeHtml(task.last_run || "N/A")}</span>
                        </div>
                    </div>`;
                }).join("");
            } else {
                taskList.innerHTML = '<div class="empty-state">No Rocky tasks found in Task Scheduler.<br><br><span style="font-size: 11px; color: var(--text-dim);">Tasks should be created in a <code style="background: var(--bg); padding: 2px 4px; border-radius: 3px;">\\Rocky\\</code> folder in Task Scheduler, or have "Rocky" in their name.</span></div>';
            }

            // --- Header meta ---
            document.getElementById("header-time").textContent = new Date().toLocaleTimeString();
            if (data.log_size !== undefined) {
                document.getElementById("header-log-info").textContent =
                    `rocky.log · ${formatBytes(data.log_size)} · ${timeAgo(data.log_modified)}`;
            }

        } catch (e) {
            console.warn("Status fetch failed:", e);
        }
    };

    // --- Dormant toggle ---

    window.toggleDormant = async function() {
        try {
            await fetch("/api/dormant", { method: "POST" });
            await refreshStatus();
        } catch (e) {
            console.warn("Dormant toggle failed:", e);
        }
    };

    // --- Task toggle ---

    window.toggleTask = async function(taskName, enable) {
        try {
            const res = await fetch("/api/tasks/toggle", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: taskName, enable }),
            });
            const data = await res.json();
            if (!data.success) {
                alert("Failed to toggle task. You may need to run the dashboard as administrator.");
            }
            // Refresh after a moment (Task Scheduler needs a beat).
            setTimeout(refreshStatus, 1000);
        } catch (e) {
            console.warn("Task toggle failed:", e);
        }
    };

    // --- Boot ---

    async function init() {
        // Mark auto-scroll button as active.
        const btn = document.getElementById("btn-autoscroll");
        btn.style.borderColor = "var(--blue)";
        btn.style.color = "var(--blue)";

        // Load recent log history, then start SSE for new lines.
        await loadHistory();
        connectSSE();

        // Poll status every 10 seconds.
        await refreshStatus();
        statusInterval = setInterval(refreshStatus, 10000);
    }

    init();
})();
</script>
</body>
</html>
